name: CRAN 0.0.7 macOS recheck
on:
  push:
    branches: ['cran/0.0.7-checks-20261019']
    paths: ['.cran-release/ICESat2VegR_0.0.7.tar.gz']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    name: ${{ matrix.label }} / R ${{ matrix.r }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-15, label: macOS-arm64, r: release}
          - {os: macos-15, label: macOS-arm64, r: devel}
          - {os: macos-15-intel, label: macOS-Intel, r: release}
          - {os: macos-15-intel, label: macOS-Intel, r: devel}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      NOT_CRAN: 'false'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MAKEFLAGS: '-j2'
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-tinytex@v2
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev libproj-dev libhdf5-dev libgeos-dev libudunits2-dev pkg-config
      - name: Install macOS system libraries
        if: runner.os == 'macOS'
        run: |
          brew install gdal proj hdf5 gettext udunits libomp pkg-config autoconf automake libtool
          echo "CPATH=$(brew --prefix proj)/include:$(brew --prefix hdf5)/include:$(brew --prefix gettext)/include:$(brew --prefix udunits)/include" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$(brew --prefix proj)/lib:$(brew --prefix hdf5)/lib:$(brew --prefix gettext)/lib:$(brew --prefix udunits)/lib:$(brew --prefix libomp)/lib" >> "$GITHUB_ENV"
          mkdir -p ~/.R
          printf 'LDFLAGS = -L%s/lib %s\n' "$(brew --prefix libomp)" "$(R CMD config LDFLAGS)" >> ~/.R/Makevars
      - name: Verify and extract the exact release archive
        shell: Rscript {0}
        run: |
          file <- '.cran-release/ICESat2VegR_0.0.7.tar.gz'
          stopifnot(unname(tools::md5sum(file)) == '04c9b3ef068f929e0ed0350a50d666e8')
          dir.create('release-source')
          untar(file, exdir = 'release-source')
          cat(R.version.string, '\n', R.version$platform, '\n')
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: release-source/ICESat2VegR
          extra-packages: any::rcmdcheck
          needs: check
      - name: Check the unchanged source tarball
        shell: Rscript {0}
        run: |
          rcmdcheck::rcmdcheck('.cran-release/ICESat2VegR_0.0.7.tar.gz',
            args = c('--as-cran', '--run-donttest'),
            check_dir = 'checks', error_on = 'warning')
      - name: Configure a fresh managed Python and test HDF5
        shell: Rscript {0}
        run: |
          source('.cran-release/python-smoke.R')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checks-${{ matrix.label }}-${{ matrix.r }}
          path: |
            checks/**/00check.log
            checks/**/00install.out
            checks/**/*.Rout*
            checks/**/*.log
            checks/**/*.pdf
          if-no-files-found: warn
